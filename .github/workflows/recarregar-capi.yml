name: recarregar-capi

# O conector da Capi lê a versão mais recente do método quando reinicia. Este aviso
# faz a Capi reiniciar logo depois de cada mudança no main.
on:
  push:
    branches: [main]
    paths: ['**.md']
  workflow_dispatch:

permissions: {}

jobs:
  avisar-capi:
    if: github.repository == 'capi-legal/metodo-advogados'
    runs-on: ubuntu-latest
    steps:
      - env:
          GH_TOKEN: ${{ secrets.CAPI_API_SYNC_TOKEN }}
        run: gh api repos/capi-legal/capi-api/dispatches -f event_type=metodo-updated -f "client_payload[sha]=$GITHUB_SHA"
